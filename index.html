<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAFTA — World Cup Draft Game</title>
<style>
  :root{--bg:#0a2a16;--cream:#f3ecd8;--gold:#e7b23e;--red:#e8462b;--ink:#0a2a16}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;background:
    radial-gradient(120% 100% at 50% 0%,#1b6e3c,#06200e);color:var(--cream);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
  .card{max-width:560px;text-align:center}
  h1{font-size:64px;letter-spacing:2px;margin:0;font-weight:900}
  .bar{height:8px;width:140px;background:linear-gradient(90deg,#f5b11e,#c8a24b);border-radius:5px;margin:14px auto 6px}
  .kick{color:var(--red);font-weight:800;letter-spacing:6px;font-size:15px}
  p{color:#d8d2bf;line-height:1.6;font-size:17px}
  .btns{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:10px}
  .mail{background:var(--red);color:#fff}
  .ghost{border:1.5px solid rgba(243,236,216,.4);color:var(--cream)}
  .foot{margin-top:34px;color:#9fb3a4;font-size:13px}
</style></head>
<body><div class="card">
  <h1>DRAFTA</h1>
  <div class="bar"></div>
  <div class="kick">WORLD CUP</div>
  <p>Roll the dice, draft legends from every World Cup, and simulate the whole tournament — group stage to the final. Build your all-time dream XI.</p>
  <div class="btns">
    <a class="btn mail" href="mailto:kaanbudak0@gmail.com">Contact Support</a>
    <a class="btn ghost" href="./privacy.html">Privacy Policy</a>
  </div>
  <div class="foot">Support: kaanbudak0@gmail.com · © 2026 DRAFTA</div>
</div></body></html>
